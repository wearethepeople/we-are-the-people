name: 🚀 Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ⬣ ESLint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: 📥 Download deps
        run: npm ci

      - name: 🔬 Lint
        run: npm run lint

      - name: 💅 Format check
        run: npm run format:check

  typecheck:
    name: ʦ TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: 📥 Download deps
        run: npm ci

      - name: 🔎 Type check
        run: npm run typecheck

  deploy:
    name: 🚀 Deploy
    needs: [lint, typecheck]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 🚀 Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Tells IndexNow (Bing, Yandex and other participating engines) about every
  # URL in the live sitemap once the deploy is out. INDEXNOW_KEY must match
  # the key file public/<key>.txt, which proves ownership. The key is public
  # by design. Same job in wearethepeople.us, whatsyourtake.us and
  # itsourmoney.us.
  indexnow:
    name: 🔎 IndexNow
    needs: [deploy]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      SITE: https://wearethepeople.us
      INDEXNOW_KEY: 57f92bda7019509c5b68149b8c4b0ae2
    steps:
      - name: 🔎 Submit sitemap URLs
        run: |
          urls=$(curl -fsS "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' \
            | jq -Rsc 'split("\n") | map(select(length > 0))')
          jq -n --arg host "${SITE#https://}" --arg key "$INDEXNOW_KEY" --argjson urls "$urls" \
            '{host: $host, key: $key, urlList: $urls}' \
            | curl -fsS -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' --data-binary @- \
                -o /dev/null -w 'IndexNow: HTTP %{http_code}\n'
