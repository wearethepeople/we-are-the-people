# fly.toml app configuration file for we-are-the-people.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'we-are-the-people'
primary_region = 'dfw'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]
[env]
PORT = '8080'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
interval = '30s'
timeout = '5s'
grace_period = '10s'
method = 'GET'
path = '/resources/healthcheck'

[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1
